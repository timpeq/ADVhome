[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; The device is a shared M5Launcher install; advhome must fit inside its fixed
; 1280K "advhom" (ota_3) app slot at flash offset 0x5e0000 (see ptable.bin).
; This CSV mirrors that slot's size so a build that no longer fits fails loudly
; here instead of silently overflowing into the neighboring app on the device.
board_build.partitions = advhome_partitions.csv

; Necessary for serial monitor over USB CDC on StampS3
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified@^0.2.9
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.4.1
    https://github.com/earlephilhower/ESP8266Audio.git#1.9.9

extra_scripts = 
    pre:git_version.py
    post:merge_firmware.py

